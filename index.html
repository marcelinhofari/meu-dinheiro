<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu dinheiro</title>
<meta name="description" content="Controle de entradas, compras e dívidas. Seus dados ficam só no seu aparelho.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#EEF1F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0F1E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meu dinheiro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --chip:#F1F5F9;
  --in:#0EA371; --out:#E5385B; --debt:#D97706; --brand:#4338CA; --hero:#161A3A; --hero-ink:#FFFFFF; --hero-mut:#B4BBE3;
  --on-brand:#FFFFFF; --focus:#4338CA; --shadow:0 1px 2px rgba(15,23,42,.06),0 8px 24px rgba(15,23,42,.06);
  --font:system-ui,-apple-system,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B0F1E; --surface:#141A2E; --ink:#E7EAF6; --muted:#8C96B5; --line:#232B45; --chip:#1B2340;
    --in:#34D399; --out:#FB7185; --debt:#FBB040; --brand:#8B93FF; --hero:#1D2350; --hero-mut:#B4BBE3; --focus:#8B93FF; --on-brand:#0B0F1E;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --on-brand:#0B0F1E;
  --bg:#0B0F1E; --surface:#141A2E; --ink:#E7EAF6; --muted:#8C96B5; --line:#232B45; --chip:#1B2340;
  --in:#34D399; --out:#FB7185; --debt:#FBB040; --brand:#8B93FF; --hero:#1D2350; --hero-mut:#B4BBE3; --focus:#8B93FF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
.num{font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit;touch-action:manipulation}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 190px}

.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;min-height:44px}
.head{flex-wrap:wrap}
.head h1{font-size:23px;font-weight:800;margin:0;letter-spacing:-.02em;white-space:nowrap}
.mnav{display:flex;align-items:center;background:var(--surface);border-radius:999px;box-shadow:var(--shadow);padding:3px}
.mnav button{border:0;background:transparent;width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1}
.mnav button:active{background:var(--chip)}
.mnav .lb{min-width:118px;text-align:center;font-weight:700;font-size:14px;white-space:nowrap}
.banner{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;border-left:4px solid var(--debt);display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.bad{border-left-color:var(--out)}
.banner strong{display:block}
.banner button{border:0;background:var(--chip);border-radius:999px;padding:8px 14px;font-weight:700;white-space:nowrap}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:26px;padding:22px 20px 20px;box-shadow:var(--shadow)}
.hero .cap{color:var(--hero-mut);font-size:14px;font-weight:600}
.hero .big{font-size:clamp(38px,11vw,56px);font-weight:800;letter-spacing:-.035em;line-height:1.05;margin:4px 0 6px;word-break:break-word}
.hero .big.neg{color:#FF9DB0}
.hero .sub{color:var(--hero-mut);font-size:14px}
.trio{display:grid;gap:8px;margin-top:18px}
.trio .c{background:rgba(255,255,255,.09);border-radius:14px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.trio .k{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--hero-mut);font-weight:600}
.trio .k i{width:9px;height:9px;border-radius:50%;display:block;flex:none}
.trio .v{font-weight:800;font-size:17px;letter-spacing:-.01em;white-space:nowrap}
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-top:14px}
.card h2{font-size:17px;font-weight:800;margin:0;letter-spacing:-.01em}
.card .hint{color:var(--muted);font-size:13.5px;margin:2px 0 10px}
.cardhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.more{border:0;background:transparent;color:var(--brand);font-weight:700;font-size:14px;padding:6px}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.qbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.qb{border:0;border-radius:16px;padding:14px 6px;background:var(--chip);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;gap:6px}
.qb span{font-size:24px}
.qb:active{filter:brightness(.95)}

.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.row:first-of-type{border-top:0}
.ico{width:42px;height:42px;border-radius:14px;background:var(--chip);display:grid;place-items:center;font-size:20px;flex:none}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.row .amt{font-weight:800;white-space:nowrap;text-align:right}
.row .amt.in{color:var(--in)}
.pill{background:var(--chip);border-radius:999px;padding:1px 8px;font-size:12px;font-weight:600}
.pill.ok{color:var(--in)} .pill.wait{color:var(--debt)}
.due.late{color:var(--out);font-weight:700} .due.soon{color:var(--debt);font-weight:700}
.pay{border:0;background:var(--brand);color:var(--on-brand);border-radius:999px;padding:9px 14px;font-weight:700;font-size:13.5px;white-space:nowrap;min-height:38px}
.pay:active{filter:brightness(1.15)}
.pay.in{background:var(--in);color:var(--on-brand)}
.bill{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.bill:first-of-type{border-top:0}
.bill .nm{font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.bill .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.bill .mid{min-width:0}
.bill .meta{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.grp{font-size:13.5px;font-weight:800;margin:18px 0 0;display:flex;justify-content:space-between}
.grp:first-child{margin-top:0}
.grp.late{color:var(--out)}

.cat{margin:12px 0}
.cat .t{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600;margin-bottom:6px}
.cat .t .pc{color:var(--muted);font-weight:500}
.track{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--brand);border-radius:6px;transition:width .35s ease}

.tools{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:0;background:var(--chip);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;min-height:38px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.search{width:100%;border:0;background:var(--chip);border-radius:14px;padding:11px 14px;min-height:46px;font-size:16px}

.btn{border:0;background:var(--chip);border-radius:14px;min-height:48px;padding:0 16px;font-weight:700;font-size:15px;width:100%;margin-top:8px}
.btn:active{filter:brightness(.95)}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.danger{background:transparent;color:var(--out);box-shadow:inset 0 0 0 1.5px var(--out)}
.btn.danger.armed{background:var(--out);color:var(--on-brand)}
.set p{margin:6px 0;color:var(--muted);font-size:14px}
.set ol{margin:8px 0 0;padding-left:20px;color:var(--ink);font-size:14.5px}
.set li{margin:6px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv:first-of-type{border-top:0}
.kv span:first-child{color:var(--muted)}
.gate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto}
.gate[hidden]{display:none}
.gate .box{width:100%;max-width:400px;background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:28px 22px 24px;text-align:center}
.gate img{width:84px;height:84px;border-radius:22px;display:block;margin:0 auto 14px}
.gate h1{font-size:24px;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
.gate p{margin:0 0 18px;color:var(--muted);font-size:14.5px}
.gate input{width:100%;border:0;background:var(--chip);border-radius:14px;padding:14px;min-height:54px;font-size:20px;font-weight:700;letter-spacing:.12em;text-align:center;text-transform:uppercase}
.gate .g-err{min-height:22px;margin:10px 0 4px;color:var(--out);font-size:14px;font-weight:600}
.gate .save{margin-top:4px}
.gate .small{margin:16px 0 0;font-size:13px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;color:inherit}
a.btn.primary{color:var(--on-brand)}
.ver{text-align:center;color:var(--muted);font-size:12.5px;margin-top:18px}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none}
.dock .bar{pointer-events:auto;max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px;box-shadow:0 6px 30px rgba(15,23,42,.2);display:grid;grid-template-columns:repeat(4,1fr);padding:6px}
.tab{border:0;background:transparent;border-radius:18px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:700;color:var(--muted);position:relative;min-height:54px}
.tab .e{font-size:20px;line-height:1}
.tab[aria-current="page"]{background:var(--chip);color:var(--ink)}
.tab .bd{position:absolute;top:3px;right:calc(50% - 26px);background:var(--out);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 5px}
.tab .bd[hidden]{display:none}
.fab{position:fixed;z-index:21;right:max(16px,calc(50% - 344px));bottom:calc(92px + env(safe-area-inset-bottom,0px));border:0;background:var(--brand);color:var(--on-brand);border-radius:999px;height:56px;padding:0 22px 0 18px;font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 28px rgba(67,56,202,.45)}
.fab span{font-size:26px;line-height:1;margin-top:-2px}
.fab:active{filter:brightness(1.1)}

.ov{position:fixed;inset:0;z-index:40;background:rgba(10,14,30,.55);display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:94%;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease;overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:600px){.ov{align-items:center}.sheet{border-radius:28px}}
.sh-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh-head h2{margin:0;font-size:18px;font-weight:800}
.x{border:0;background:var(--chip);width:40px;height:40px;border-radius:50%;font-size:18px;line-height:1}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--chip);padding:4px;border-radius:16px;margin-bottom:16px}
.seg button{border:0;background:transparent;border-radius:12px;padding:11px 4px;font-weight:700;font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}
.seg button[data-v="Receita"][aria-pressed="true"]{color:var(--in)}
.seg button[data-v="Gasto"][aria-pressed="true"]{color:var(--out)}
.seg button[data-v="Conta a pagar"][aria-pressed="true"]{color:var(--debt)}
.amount{display:flex;align-items:baseline;gap:8px;justify-content:center;margin:2px 0 14px}
.amount b{font-size:24px;color:var(--muted)}
.amount input{border:0;background:transparent;font-size:clamp(40px,12vw,54px);font-weight:800;width:100%;max-width:300px;text-align:left;letter-spacing:-.03em;padding:0;min-width:0}
.amount input::placeholder{color:var(--line)}
.amount input:focus-visible{outline:none}
.fld{display:block;margin-bottom:14px}
.fld>span{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.fld input,.fld select{width:100%;border:0;background:var(--chip);border-radius:14px;padding:12px 14px;min-height:48px;font-size:16px}
.fld[hidden]{display:none}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{border:0;background:var(--chip);border-radius:999px;padding:9px 13px;font-weight:600;font-size:14px;min-height:40px}
.cats button[aria-pressed="true"]{background:var(--brand);color:var(--on-brand)}
.stepper{display:flex;align-items:center;gap:12px;background:var(--chip);border-radius:14px;padding:6px}
.stepper button{border:0;background:var(--surface);width:42px;height:42px;border-radius:11px;font-size:20px;font-weight:700;line-height:1}
.stepper .n{flex:1;text-align:center;font-weight:800}
.stepper .n small{display:block;font-weight:600;color:var(--muted);font-size:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two.one{grid-template-columns:1fr}
.save{width:100%;border:0;background:var(--brand);color:var(--on-brand);border-radius:18px;min-height:54px;font-weight:800;font-size:16px;margin-top:6px}
.save:active{filter:brightness(1.1)} .save:disabled{opacity:.55}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(168px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:14px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s;display:flex;gap:14px;align-items:center}
.toast.show{opacity:1}
.toast.act{pointer-events:auto}
.toast button{border:0;background:transparent;color:inherit;font-weight:800;text-decoration:underline;padding:4px;font-size:14px}
@media (prefers-reduced-motion:reduce){.fill,.toast{transition:none}.sheet{animation:none}}
</style>
</head>
<body>
<noscript><p style="padding:24px">Este app precisa de JavaScript para funcionar.</p></noscript>
<div class="wrap">
  <div class="head" id="head"></div>
  <div id="banners"></div>
  <main id="view"></main>
</div>

<button class="fab" id="fab" type="button" aria-label="Novo lançamento"><span>+</span>Novo</button>

<nav class="dock" aria-label="Seções">
  <div class="bar">
    <button class="tab" data-t="resumo" type="button"><span class="e">🏠</span>Resumo</button>
    <button class="tab" data-t="pagar" type="button"><span class="e">🧾</span>A pagar<span class="bd" id="badge" hidden></span></button>
    <button class="tab" data-t="hist" type="button"><span class="e">📒</span>Histórico</button>
    <button class="tab" data-t="ajustes" type="button"><span class="e">⚙️</span>Ajustes</button>
  </div>
</nav>

<div class="ov" id="ov">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <div class="sh-head"><h2 id="sh-title">Novo lançamento</h2><button class="x" id="close" type="button" aria-label="Fechar">&#10005;</button></div>
    <div class="seg" id="seg" role="group" aria-label="Tipo de lançamento">
      <button type="button" data-v="Receita" aria-pressed="false">Entrada</button>
      <button type="button" data-v="Gasto" aria-pressed="true">Compra</button>
      <button type="button" data-v="Conta a pagar" aria-pressed="false">Dívida</button>
    </div>
    <div class="amount"><b>R$</b><input id="f-valor" type="text" inputmode="decimal" placeholder="0,00" autocomplete="off" aria-label="Valor em reais"></div>
    <label class="fld"><span id="l-desc">O que foi?</span><input id="f-desc" type="text" placeholder="Ex.: mercado" autocomplete="off"></label>
    <div class="fld" id="w-cat"><span>Categoria</span><div class="cats" id="cats-pick"></div></div>
    <div class="two" id="two-dt">
      <label class="fld"><span id="l-data">Data</span><input id="f-data" type="date"></label>
      <label class="fld" id="w-status"><span>Situação</span><select id="f-status"></select></label>
    </div>
    <div class="fld" id="w-rep">
      <span id="l-rep">Parcelas</span>
      <div class="stepper"><button type="button" id="rep-m" aria-label="Menos">&#8722;</button><div class="n" id="rep-n"></div><button type="button" id="rep-p" aria-label="Mais">+</button></div>
    </div>
    <button class="save" id="save" type="button">Salvar</button>
    <div id="del-area"></div>
  </div>
</div>
<div class="gate" id="gate" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file-in" accept=".json,application/json" hidden>

<script>
(function(){
'use strict';

/* ================= armazenamento (somente neste aparelho) ================= */
var KEY='meu-dinheiro:v1', META='meu-dinheiro:meta';
var APP_VERSION='1.1.0';

/* ===== CONFIGURAÇÃO DA VERSÃO DE TESTE =====
   ACCESS_HASHES: lista de códigos de acesso (guardados só como hash).
   - Para cortar o acesso de uma pessoa, apague o hash dela da lista.
   - Para abrir o app para todos (lançamento), deixe a lista vazia: [].
   FEEDBACK_WHATSAPP: seu número com código do país e DDD, só dígitos (ex.: 5581999999999).
   FEEDBACK_EMAIL: alternativa por e-mail. Se os dois estiverem vazios, o botão de feedback não aparece. */
var ACCESS_SALT='meu-dinheiro:v1';
var ACCESS_KEY='meu-dinheiro:acesso';
var ACCESS_HASHES=[
 "c7a2c09b251017b28d7fe32239c54fe6bfa13060dadd0cc39f1ef9591d9b6da3",
 "704da8b801596bc35641b35b6a90dac5193dd4e320608a17e9598d405f445ee9",
 "f50aa6cca9f4b7db54b5fd0991bdc70810a5fa3ac596c9ddb41e6410093eed5b",
 "0726b8ccb76ea6fb0c420f9fdb7ebb15be47b7c5c1c50041de332e47dc478a95",
 "4c21944261f975e16b36eb49a14050b71aa674d1397a5aa4188751922b20cc60",
 "0dea38431733b424ba1688d82d166c05e46230a5c571b6bd60036d85359fbbe4",
 "051b453a94f4c55eefea63183ef865e613dea9bff7d615b4a5fac0f64c3cdc16",
 "51a07570e876afd802880791f9f23730b17a16cc707b102811744a2dcea97ffd",
 "59fd84fb82e70fa66ea2cdbc73aed9eae41d45ef85d6018b30ade2f51ce3c9f1",
 "4dd5cc2ca1e7711dffd2c36326f81b0a764142bce75fc19561ad33bd104e59b7"
];
var FEEDBACK_WHATSAPP='';
var FEEDBACK_EMAIL='';
var rows=[], meta={lastBackup:null}, memOnly=false;

function load(){
  try{
    var raw=window.localStorage.getItem(KEY);
    rows=raw?JSON.parse(raw):[];
    if(!Array.isArray(rows))rows=[];
    var m=window.localStorage.getItem(META);
    if(m)meta=Object.assign(meta,JSON.parse(m));
  }catch(e){memOnly=true;rows=[]}
}
function save(){
  try{
    window.localStorage.setItem(KEY,JSON.stringify(rows));
    window.localStorage.setItem(META,JSON.stringify(meta));
    return true;
  }catch(e){
    memOnly=true;
    toast('Não consegui salvar neste aparelho. Exporte um backup agora.');
    renderBanners();
    return false;
  }
}
function uid(){return Math.random().toString(36).slice(2,8)+Date.now().toString(36)}

/* ================= utilidades ================= */
var CATS=[['Moradia','🏠'],['Alimentação','🍽️'],['Transporte','🚗'],['Saúde','❤️'],['Lazer','🎉'],['Educação','📚'],['Assinaturas','🔁'],['Outros','📦']];
var CEMOJI={};CATS.forEach(function(c){CEMOJI[c[0]]=c[1]});
var TLAB={'Receita':'Entrada','Gasto':'Compra','Conta a pagar':'Dívida'};
var brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});

function $(id){return document.getElementById(id)}
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function dayNum(s){var p=s.slice(0,10).split('-');return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000)}
function fmtDate(s){if(!s)return 'sem data';var p=s.slice(0,10).split('-');return p[2]+'/'+p[1]}
function fmtDateFull(s){if(!s)return '';var p=s.slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function money(n){return brl.format(n)}
function addMonths(s,i){
  var p=s.split('-'),y=+p[0],m=+p[1]-1+i,d=+p[2];
  y+=Math.floor(m/12);m=((m%12)+12)%12;
  var last=new Date(y,m+1,0).getDate();
  return y+'-'+pad(m+1)+'-'+pad(Math.min(d,last));
}
function el(tag,props){
  var e=document.createElement(tag);
  if(props){for(var k in props){var v=props[k];
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k.indexOf('on')===0)e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  }}
  for(var i=2;i<arguments.length;i++){var c=arguments[i];if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}
  return e;
}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild)}
function parseMoney(s){
  s=String(s).trim().replace(/[^\d.,]/g,'');
  if(s.indexOf(',')>=0)s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  return parseFloat(s);
}
var toastTimer=null;
function toast(msg,label,fn){
  var t=$('toast');clear(t);t.append(msg);
  t.classList.toggle('act',!!fn);
  if(fn){t.append(el('button',{type:'button',text:label,onclick:function(){t.classList.remove('show','act');fn()}}))}
  t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show','act')},fn?6000:3200);
}
function snapshot(){return JSON.stringify(rows)}
function undoTo(snap){return function(){rows=JSON.parse(snap);save();renderAll()}}

/* ================= estado de tela ================= */
var now=new Date();
var ym={y:now.getFullYear(),m:now.getMonth()};
var tab='resumo', filterTipo='', query='';
var form={tipo:'Gasto',cat:'Outros',rep:1,editId:null,armed:null};
var deferredInstall=null;

function monthLabel(){var t=new Date(ym.y,ym.m,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});return t.charAt(0).toUpperCase()+t.slice(1)}
function monthRange(){
  var last=new Date(ym.y,ym.m+1,0).getDate();
  return [ym.y+'-'+pad(ym.m+1)+'-01', ym.y+'-'+pad(ym.m+1)+'-'+pad(last)];
}
function inMonth(d){var r=monthRange();return !!d&&d.slice(0,10)>=r[0]&&d.slice(0,10)<=r[1]}
function isPendBill(r){return r.tipo==='Conta a pagar'&&r.status==='Pendente'}
function isPendIn(r){return r.tipo==='Receita'&&r.status==='Pendente'}
function monthRows(){return rows.filter(function(r){return inMonth(r.data)})}
function byDateDesc(a,b){return (b.data||'')<(a.data||'')?-1:((b.data||'')>(a.data||'')?1:((b.criado||0)-(a.criado||0)))}
function byDateAsc(a,b){return (a.data||'9999')<(b.data||'9999')?-1:((a.data||'9999')>(b.data||'9999')?1:0)}

function totals(){
  var t={recAll:0,rec:0,gas:0,pag:0,pen:0};
  monthRows().forEach(function(r){
    if(r.tipo==='Receita'){t.recAll+=r.valor;if(r.status!=='Pendente')t.rec+=r.valor}
    else if(r.tipo==='Gasto')t.gas+=r.valor;
    else if(r.status==='Pago')t.pag+=r.valor;
    else t.pen+=r.valor;
  });
  t.saiu=t.gas+t.pag;t.saldo=t.rec-t.saiu;t.prev=t.recAll-t.saiu-t.pen;
  return t;
}
function dueInfo(d){
  if(!d)return {c:'',t:'sem vencimento'};
  var n=dayNum(d)-dayNum(today());
  if(n<0)return {c:'late',t:'venceu há '+(-n)+(n===-1?' dia':' dias')+' ('+fmtDate(d)+')'};
  if(n===0)return {c:'soon',t:'vence hoje'};
  if(n===1)return {c:'soon',t:'vence amanhã'};
  if(n<=7)return {c:'soon',t:'vence em '+n+' dias ('+fmtDate(d)+')'};
  return {c:'',t:'vence em '+fmtDate(d)};
}

/* ================= ações ================= */
function markDone(r,msg){
  var snap=snapshot();
  rows.forEach(function(x){if(x.id===r.id)x.status='Pago'});
  save();renderAll();
  toast(msg,'Desfazer',undoTo(snap));
}
function addItem(item,n){
  var grupo=n>1?uid():null;
  for(var i=0;i<n;i++){
    rows.push({id:uid(),desc:n>1?item.desc+' ('+(i+1)+'/'+n+')':item.desc,valor:item.valor,tipo:item.tipo,cat:item.cat,
      status:i===0?item.status:'Pendente',data:i===0?item.data:addMonths(item.data,i),grupo:grupo,criado:Date.now()+i});
  }
  save();
}

/* ================= peças de tela ================= */
function iconFor(r){return r.tipo==='Receita'?'💰':(r.tipo==='Conta a pagar'?'🧾':(CEMOJI[r.cat]||'📦'))}
function openOnKey(node,fn){
  node.setAttribute('role','button');node.setAttribute('tabindex','0');
  node.addEventListener('click',fn);
  node.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();fn()}});
}
function txRow(r){
  var isIn=r.tipo==='Receita';
  var meta=el('div',{class:'meta'},el('span',{text:fmtDate(r.data)}));
  if(r.tipo==='Conta a pagar')meta.append(el('span',{class:'pill '+(r.status==='Pago'?'ok':'wait'),text:r.status==='Pago'?'Paga':'Falta pagar'}));
  else if(isIn&&r.status==='Pendente')meta.append(el('span',{class:'pill wait',text:'A receber'}));
  else meta.append(el('span',{text:TLAB[r.tipo]}));
  var row=el('div',{class:'row'},
    el('div',{class:'ico',text:iconFor(r)}),
    el('div',{class:'mid'},el('div',{class:'nm',text:r.desc}),meta),
    el('div',{class:'amt num'+(isIn?' in':''),text:(isIn?'+ ':'− ')+money(r.valor)}));
  openOnKey(row,function(){openEdit(r)});
  return row;
}
function actionRow(r,label,cls,doneMsg){
  var isIn=r.tipo==='Receita';
  var di=isIn?{c:(dayNum(r.data)<=dayNum(today())?'soon':''),t:(dayNum(r.data)<=dayNum(today())?'era para chegar em '+fmtDate(r.data):'previsto para '+fmtDate(r.data))}:dueInfo(r.data);
  var btn=el('button',{class:'pay '+cls,type:'button',text:label});
  btn.addEventListener('click',function(e){e.stopPropagation();markDone(r,doneMsg)});
  var row=el('div',{class:'bill'},
    el('div',{class:'ico',text:iconFor(r)}),
    el('div',{class:'mid'},el('div',{class:'nm',text:r.desc}),
      el('div',{class:'meta'},el('span',{class:'due '+di.c,text:di.t}))),
    el('div',{class:'r'},el('b',{class:'num',text:money(r.valor)}),btn));
  openOnKey(row,function(){openEdit(r)});
  return row;
}
function billRow(r){return actionRow(r,'Paguei','','Dívida marcada como paga ✓')}
function inRow(r){return actionRow(r,'Recebi','in','Entrada marcada como recebida ✓')}

function viewResumo(v){
  var t=totals();
  var hero=el('section',{class:'hero','aria-label':'Resumo do mês'});
  hero.append(el('div',{class:'cap',text:'Saldo do mês'}));
  hero.append(el('div',{class:'big num'+(t.saldo<0?' neg':''),text:money(t.saldo)}));
  hero.append(el('div',{class:'sub num',text:t.pen>0?('Faltam '+money(t.pen)+' em contas · deve sobrar '+money(t.prev)):('Previsão de sobra no mês: '+money(t.prev))}));
  var trio=el('div',{class:'trio'});
  [['var(--in)','Entrou',t.rec],['var(--out)','Saiu',t.saiu],['var(--debt)','Falta pagar',t.pen]].forEach(function(x){
    var dot=el('i');dot.style.background=x[0];
    trio.append(el('div',{class:'c'},el('div',{class:'k'},dot,x[1]),el('div',{class:'v num',text:money(x[2])})));
  });
  hero.append(trio);v.append(hero);

  if(!rows.length){
    var w=el('section',{class:'card'},el('h2',{text:'Vamos começar'}),el('p',{class:'hint',text:'Registre o que entrou, o que você comprou e o que você deve. Leva poucos segundos.'}));
    var q=el('div',{class:'qbtns'});
    [['Receita','💰','Entrada'],['Gasto','🛍️','Compra'],['Conta a pagar','🧾','Dívida']].forEach(function(b){
      q.append(el('button',{class:'qb',type:'button',onclick:function(){openSheet(b[0])}},el('span',{text:b[1]}),b[2]));
    });
    w.append(q);v.append(w);
  }

  var td=dayNum(today());
  var inList=rows.filter(function(r){return isPendIn(r)&&r.data&&dayNum(r.data)<=td}).sort(byDateAsc);
  if(inList.length){
    var rc=el('section',{class:'card'},el('h2',{text:'Dinheiro para receber'}),el('p',{class:'hint',text:'Toque em "Recebi" quando cair na conta.'}));
    inList.slice(0,3).forEach(function(r){rc.append(inRow(r))});
    v.append(rc);
  }

  var pl=rows.filter(isPendBill).sort(byDateAsc);
  if(pl.length){
    var c=el('section',{class:'card'});
    c.append(el('div',{class:'cardhead'},el('h2',{text:'Próximas contas'}),el('button',{class:'more',type:'button',text:'Ver todas',onclick:function(){setTab('pagar')}})));
    pl.slice(0,3).forEach(function(r){c.append(billRow(r))});
    v.append(c);
  }

  var sums={},tot=0;
  monthRows().forEach(function(r){if(r.tipo!=='Receita'){sums[r.cat]=(sums[r.cat]||0)+r.valor;tot+=r.valor}});
  var keys=Object.keys(sums).sort(function(a,b){return sums[b]-sums[a]});
  if(keys.length){
    var cc=el('section',{class:'card'},el('h2',{text:'Para onde foi o dinheiro'}),el('p',{class:'hint',text:'Compras e contas do mês, por categoria.'}));
    keys.forEach(function(k){
      var f=el('div',{class:'fill'});f.style.width=(sums[k]/sums[keys[0]]*100)+'%';
      cc.append(el('div',{class:'cat'},
        el('div',{class:'t'},el('span',{text:(CEMOJI[k]||'📦')+' '+k}),el('span',{class:'num'},money(sums[k])+' ',el('span',{class:'pc',text:Math.round(sums[k]/tot*100)+'%'}))),
        el('div',{class:'track'},f)));
    });
    v.append(cc);
  }

  var recent=monthRows().sort(byDateDesc).slice(0,5);
  if(recent.length){
    var lc=el('section',{class:'card'});
    lc.append(el('div',{class:'cardhead'},el('h2',{text:'Últimos lançamentos'}),el('button',{class:'more',type:'button',text:'Ver tudo',onclick:function(){setTab('hist')}})));
    recent.forEach(function(r){lc.append(txRow(r))});
    v.append(lc);
  }else if(rows.length){
    v.append(el('section',{class:'card'},el('div',{class:'empty',text:'Nenhum lançamento neste mês.'})));
  }
}

function viewPagar(v){
  var list=rows.filter(isPendBill).sort(byDateAsc);
  var total=list.reduce(function(s,r){return s+r.valor},0);
  var hero=el('section',{class:'hero'});
  hero.append(el('div',{class:'cap',text:'Total que você ainda deve'}));
  hero.append(el('div',{class:'big num',text:money(total)}));
  hero.append(el('div',{class:'sub',text:list.length?(list.length+(list.length===1?' conta pendente':' contas pendentes')+', de todos os meses.'):'Nenhuma conta pendente.'}));
  v.append(hero);
  var card=el('section',{class:'card'});
  if(!list.length){
    card.append(el('div',{class:'empty',text:'Tudo em dia. Quando surgir uma dívida ou conta, toque em "Novo" e escolha Dívida.'}));
    v.append(card);return;
  }
  var groups=[['late','Atrasadas',[]],['week','Nos próximos 7 dias',[]],['later','Depois',[]]];
  var td=dayNum(today());
  list.forEach(function(r){
    var n=r.data?dayNum(r.data)-td:999;
    groups[n<0?0:(n<=7?1:2)][2].push(r);
  });
  groups.forEach(function(g){
    if(!g[2].length)return;
    var sum=g[2].reduce(function(s,r){return s+r.valor},0);
    card.append(el('div',{class:'grp '+(g[0]==='late'?'late':'')},el('span',{text:g[1]}),el('span',{class:'num',text:money(sum)})));
    g[2].forEach(function(r){card.append(billRow(r))});
  });
  v.append(card);
}

function viewHist(v){
  var card=el('section',{class:'card'});
  var tools=el('div',{class:'tools'});
  var chips=el('div',{class:'chips',role:'group','aria-label':'Filtrar por tipo'});
  [['','Tudo'],['Receita','Entradas'],['Gasto','Compras'],['Conta a pagar','Dívidas']].forEach(function(c){
    chips.append(el('button',{type:'button','aria-pressed':filterTipo===c[0]?'true':'false',text:c[1],onclick:function(){filterTipo=c[0];renderView()}}));
  });
  var inp=el('input',{class:'search',type:'search',placeholder:'Buscar pelo nome','aria-label':'Buscar lançamento',value:query});
  var holder=el('div');
  tools.append(chips,inp);card.append(tools,holder);v.append(card);
  function paint(){
    clear(holder);
    var q=query.trim().toLowerCase();
    var list=monthRows().filter(function(r){return (!filterTipo||r.tipo===filterTipo)&&(!q||r.desc.toLowerCase().indexOf(q)>=0)}).sort(byDateDesc);
    if(!list.length)holder.append(el('div',{class:'empty',text:rows.length&&monthRows().length?'Nada encontrado com esse filtro.':'Nenhum lançamento neste mês.'}));
    list.forEach(function(r){holder.append(txRow(r))});
  }
  inp.addEventListener('input',function(e){query=e.target.value;paint()});
  paint();
}

/* ---------- ajustes e backup ---------- */
function isStandalone(){return window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)}
function backupText(){return JSON.stringify({app:'meu-dinheiro',version:1,exportedAt:new Date().toISOString(),rows:rows},null,1)}
function markBackup(){meta.lastBackup=Date.now();save();renderAll()}
async function exportFile(){
  var text=backupText(), name='meu-dinheiro-backup-'+today()+'.json';
  try{
    var file=new File([text],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:'Backup Meu dinheiro'});
      markBackup();toast('Backup pronto ✓');return;
    }
  }catch(e){if(e&&e.name==='AbortError')return}
  try{
    var url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
    var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},4000);
    markBackup();toast('Backup baixado ✓');
  }catch(e){toast('Não consegui gerar o arquivo. Use "Copiar backup".')}
}
async function copyBackup(){
  try{await navigator.clipboard.writeText(backupText());markBackup();toast('Backup copiado. Cole em um lugar seguro, como Notas.')}
  catch(e){toast('Seu navegador não deixou copiar. Use "Salvar arquivo".')}
}
function importFrom(text){
  var data;
  try{data=JSON.parse(text)}catch(e){toast('Esse texto não é um backup válido.');return}
  var list=data&&Array.isArray(data.rows)?data.rows:(Array.isArray(data)?data:null);
  if(!list){toast('Esse arquivo não parece um backup do app.');return}
  var have={};rows.forEach(function(r){have[r.id]=1});
  var snap=snapshot(),added=0;
  list.forEach(function(r){
    if(!r||typeof r!=='object'||!r.desc||!(Number(r.valor)>=0)||!r.tipo)return;
    var id=r.id||uid();if(have[id])return;
    rows.push({id:id,desc:String(r.desc),valor:Number(r.valor),tipo:r.tipo,cat:r.cat||'Outros',status:r.status||'Pago',data:r.data||today(),grupo:r.grupo||null,criado:r.criado||Date.now()});
    have[id]=1;added++;
  });
  save();renderAll();
  toast(added?(added+(added===1?' lançamento importado':' lançamentos importados')):'Nada novo para importar.',added?'Desfazer':null,added?undoTo(snap):null);
}
async function pasteImport(){
  try{importFrom(await navigator.clipboard.readText())}
  catch(e){toast('Não consegui ler o que foi copiado. Use "Importar arquivo".')}
}
function armButton(btn,key,labelArmed,fn){
  if(form.armed===key){form.armed=null;fn();return}
  form.armed=key;btn.textContent=labelArmed;btn.classList.add('armed');
  setTimeout(function(){if(form.armed===key){form.armed=null;renderView()}},4000);
}
function feedbackUrl(){
  var msg='Feedback do Meu dinheiro (versão '+APP_VERSION+'):\n\n';
  if(FEEDBACK_WHATSAPP)return 'https://wa.me/'+FEEDBACK_WHATSAPP+'?text='+encodeURIComponent(msg);
  if(FEEDBACK_EMAIL)return 'mailto:'+FEEDBACK_EMAIL+'?subject='+encodeURIComponent('Feedback Meu dinheiro')+'&body='+encodeURIComponent(msg);
  return '';
}
function viewAjustes(v){
  var d=el('section',{class:'card set'},el('h2',{text:'Seus dados'}),
    el('p',{text:'Tudo fica salvo neste aparelho, dentro do app. Nada é enviado para a internet.'}));
  d.append(el('div',{class:'kv'},el('span',{text:'Lançamentos'}),el('b',{class:'num',text:String(rows.length)})));
  d.append(el('div',{class:'kv'},el('span',{text:'Último backup'}),el('b',{text:meta.lastBackup?fmtDateFull(iso(new Date(meta.lastBackup))):'nunca'})));
  d.append(el('button',{class:'btn primary',type:'button',text:'Salvar backup em arquivo',onclick:exportFile}));
  d.append(el('button',{class:'btn',type:'button',text:'Copiar backup',onclick:copyBackup}));
  d.append(el('button',{class:'btn',type:'button',text:'Importar arquivo de backup',onclick:function(){$('file-in').click()}}));
  d.append(el('button',{class:'btn',type:'button',text:'Importar do texto copiado',onclick:pasteImport}));
  v.append(d);

  if(!isStandalone()){
    var i=el('section',{class:'card set'},el('h2',{text:'Instalar no celular'}));
    if(deferredInstall){
      i.append(el('p',{text:'Instale para abrir em tela cheia, direto da tela inicial.'}));
      i.append(el('button',{class:'btn primary',type:'button',text:'Instalar app',onclick:async function(){
        deferredInstall.prompt();try{await deferredInstall.userChoice}catch(e){}deferredInstall=null;renderView();
      }}));
    }else{
      i.append(el('p',{text:'No iPhone, abra este endereço no Safari e faça:'}));
      var ol=el('ol');
      ['Toque no botão Compartilhar (quadrado com seta para cima).','Role e toque em "Adicionar à Tela de Início".','Toque em "Adicionar".','Abra sempre pelo ícone novo. Os dados ficam guardados no ícone, não no Safari.'].forEach(function(s){ol.append(el('li',{text:s}))});
      i.append(ol);
    }
    v.append(i);
  }

  var fb=feedbackUrl();
  var f=el('section',{class:'card set'},el('h2',{text:'Ajude a melhorar'}),
    el('p',{text:'Este app está em teste. Conte o que gostou, o que travou e o que faltou.'}));
  if(fb)f.append(el('a',{class:'btn primary',href:fb,target:'_blank',rel:'noopener',text:'Enviar feedback'}));
  v.append(f);

  var z=el('section',{class:'card set'},el('h2',{text:'Apagar tudo'}),el('p',{text:'Remove todos os lançamentos deste aparelho. Faça um backup antes.'}));
  var zb=el('button',{class:'btn danger'+(form.armed==='wipe'?' armed':''),type:'button',text:form.armed==='wipe'?'Toque de novo para apagar tudo':'Apagar todos os dados'});
  zb.addEventListener('click',function(){
    armButton(zb,'wipe','Toque de novo para apagar tudo',function(){
      var snap=snapshot();rows=[];save();renderAll();toast('Tudo apagado','Desfazer',undoTo(snap));
    });
  });
  z.append(zb);v.append(z);
  v.append(el('div',{class:'ver',text:'Meu dinheiro · versão '+APP_VERSION}));
}

function renderView(){
  var v=$('view');clear(v);
  if(tab==='resumo')viewResumo(v);else if(tab==='pagar')viewPagar(v);else if(tab==='hist')viewHist(v);else viewAjustes(v);
}
function renderHead(){
  var h=$('head');clear(h);
  var titles={resumo:'Meu dinheiro',pagar:'A pagar',hist:'Histórico',ajustes:'Ajustes'};
  h.append(el('h1',{text:titles[tab]}));
  if(tab==='resumo'||tab==='hist'){
    h.append(el('div',{class:'mnav',role:'group','aria-label':'Mês exibido'},
      el('button',{type:'button','aria-label':'Mês anterior',text:'‹',onclick:function(){changeMonth(-1)}}),
      el('div',{class:'lb',text:monthLabel()}),
      el('button',{type:'button','aria-label':'Próximo mês',text:'›',onclick:function(){changeMonth(1)}})));
  }
}
function renderBanners(){
  var b=$('banners');clear(b);
  if(memOnly){
    b.append(el('div',{class:'banner bad'},el('div',null,el('strong',{text:'Os dados não estão sendo salvos.'}),'O navegador bloqueou o armazenamento (aba privada?). Abra o app em uma aba normal.')));
    return;
  }
  var old=!meta.lastBackup||(Date.now()-meta.lastBackup>30*86400000);
  if(tab!=='ajustes'&&rows.length>=10&&old){
    b.append(el('div',{class:'banner'},el('div',null,el('strong',{text:'Faça um backup'}),'Se o celular for trocado ou o app removido, os dados se perdem.'),
      el('button',{type:'button',text:'Fazer agora',onclick:function(){setTab('ajustes')}})));
  }
}
function renderNav(){
  var late=rows.filter(function(r){return isPendBill(r)&&r.data&&dayNum(r.data)<=dayNum(today())}).length;
  var bd=$('badge');bd.hidden=!late;bd.textContent=late;
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){
    if(t.getAttribute('data-t')===tab)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');
  });
}
function renderAll(){renderHead();renderBanners();renderView();renderNav()}
function setTab(t){tab=t;form.armed=null;renderAll();window.scrollTo(0,0)}
function changeMonth(d0){
  var d=new Date(ym.y,ym.m+d0,1);ym={y:d.getFullYear(),m:d.getMonth()};renderAll();
}

/* ================= folha de lançamento ================= */
function paintForm(){
  var t=form.tipo, edit=!!form.editId;
  $('sh-title').textContent=edit?'Editar lançamento':'Novo lançamento';
  Array.prototype.forEach.call($('seg').querySelectorAll('button'),function(b){b.setAttribute('aria-pressed',b.getAttribute('data-v')===t?'true':'false')});
  $('l-desc').textContent=t==='Receita'?'De onde veio?':(t==='Gasto'?'O que você comprou?':'O que você deve?');
  $('f-desc').placeholder=t==='Receita'?'Ex.: salário, Pix de cliente':(t==='Gasto'?'Ex.: mercado, gasolina':'Ex.: cartão, empréstimo, aluguel');
  $('l-data').textContent=t==='Conta a pagar'?'Vencimento':'Data';
  $('w-cat').hidden=(t==='Receita');
  var st=$('f-status'),cur=st.value;clear(st);
  if(t==='Receita'){st.append(el('option',{value:'Pago',text:'Já recebi'}),el('option',{value:'Pendente',text:'A receber'}))}
  else if(t==='Conta a pagar'){st.append(el('option',{value:'Pendente',text:'Falta pagar'}),el('option',{value:'Pago',text:'Já paguei'}))}
  st.value=cur||'Pago';
  $('w-status').hidden=(t==='Gasto');$('two-dt').classList.toggle('one',t==='Gasto');
  $('w-rep').hidden=(t==='Gasto'||edit);
  $('l-rep').textContent=t==='Receita'?'Repetir todo mês por':'Parcelas (uma por mês)';
  var n=form.rep;
  var sm=t==='Receita'?(n===1?'só uma vez':'meses seguidos'):(n===1?'à vista, sem parcelar':'parcelas de valor igual');
  clear($('rep-n'));$('rep-n').append(n+(n===1?' vez':' vezes'),el('small',{text:sm}));
  var cp=$('cats-pick');clear(cp);
  CATS.forEach(function(c){
    cp.append(el('button',{type:'button','aria-pressed':form.cat===c[0]?'true':'false',text:c[1]+' '+c[0],onclick:function(){form.cat=c[0];paintForm()}}));
  });
  $('save').textContent=edit?'Salvar alterações':(t==='Receita'?'Salvar entrada':(t==='Gasto'?'Salvar compra':'Salvar dívida'));
  var da=$('del-area');clear(da);
  if(edit){
    var r=rows.filter(function(x){return x.id===form.editId})[0];
    var b1=el('button',{class:'btn danger'+(form.armed==='del'?' armed':''),type:'button',text:form.armed==='del'?'Toque de novo para excluir':'Excluir este lançamento'});
    b1.addEventListener('click',function(){armButton(b1,'del','Toque de novo para excluir',function(){removeRows(function(x){return x.id===form.editId},'Lançamento excluído')})});
    da.append(b1);
    if(r&&r.grupo){
      var cnt=rows.filter(function(x){return x.grupo===r.grupo}).length;
      var b2=el('button',{class:'btn danger'+(form.armed==='delg'?' armed':''),type:'button',text:form.armed==='delg'?'Toque de novo para excluir a série':'Excluir as '+cnt+' parcelas desta série'});
      b2.addEventListener('click',function(){armButton(b2,'delg','Toque de novo para excluir a série',function(){removeRows(function(x){return x.grupo===r.grupo},'Série excluída')})});
      da.append(b2);
    }
  }
}
function removeRows(pred,msg){
  var snap=snapshot();
  rows=rows.filter(function(x){return !pred(x)});
  save();closeSheet();renderAll();
  toast(msg,'Desfazer',undoTo(snap));
}
var lastFocus=null;
function showSheet(){
  paintForm();
  lastFocus=document.activeElement;
  $('ov').classList.add('open');
}
function openSheet(tipo){
  form.editId=null;form.armed=null;
  if(tipo)form.tipo=tipo;
  form.rep=1;form.cat='Outros';
  $('f-valor').value='';$('f-desc').value='';$('f-data').value=today();
  clear($('f-status'));
  showSheet();
  $('f-status').value=form.tipo==='Conta a pagar'?'Pendente':'Pago';
  setTimeout(function(){$('f-valor').focus()},80);
}
function openEdit(r){
  form.editId=r.id;form.armed=null;form.tipo=r.tipo;form.cat=r.cat||'Outros';form.rep=1;
  $('f-valor').value=String(r.valor).replace('.',',');
  $('f-desc').value=r.desc;$('f-data').value=r.data||today();
  clear($('f-status'));
  showSheet();
  $('f-status').value=r.status||'Pago';
}
function closeSheet(){
  $('ov').classList.remove('open');form.editId=null;form.armed=null;
  if(lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus();
}

function onSave(){
  var desc=$('f-desc').value.trim(),valor=parseMoney($('f-valor').value),data=$('f-data').value;
  if(!(valor>0)){toast('Digite um valor maior que zero.');$('f-valor').focus();return}
  if(!desc){toast('Diga o que foi este lançamento.');$('f-desc').focus();return}
  if(!data){toast('Escolha uma data.');return}
  var t=form.tipo, status=t==='Gasto'?'Pago':$('f-status').value;
  var cat=t==='Receita'?'Outros':form.cat;
  if(form.editId){
    var snap=snapshot();
    rows.forEach(function(x){if(x.id===form.editId){x.desc=desc;x.valor=valor;x.tipo=t;x.cat=cat;x.status=status;x.data=data}});
    save();closeSheet();renderAll();toast('Alterações salvas ✓','Desfazer',undoTo(snap));
    return;
  }
  var n=t==='Gasto'?1:form.rep;
  addItem({desc:desc,valor:valor,tipo:t,cat:cat,status:status,data:data},n);
  var shown=inMonth(data);
  closeSheet();renderAll();
  toast(n>1?n+' lançamentos salvos ✓':(shown?'Salvo ✓':'Salvo em '+fmtDate(data)+' (outro mês) ✓'));
}

/* ================= início ================= */
function setup(){
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(t){t.addEventListener('click',function(){setTab(t.getAttribute('data-t'))})});
  $('fab').addEventListener('click',function(){openSheet()});
  $('close').addEventListener('click',closeSheet);
  $('ov').addEventListener('click',function(e){if(e.target===$('ov'))closeSheet()});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('ov').classList.contains('open'))closeSheet()});
  $('seg').addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    var nt=b.getAttribute('data-v');if(nt===form.tipo)return;
    form.tipo=nt;form.armed=null;
    if(nt==='Gasto')form.rep=1;
    clear($('f-status'));paintForm();
    $('f-status').value=nt==='Conta a pagar'?'Pendente':'Pago';
  });
  $('rep-m').addEventListener('click',function(){form.rep=Math.max(1,form.rep-1);paintForm()});
  $('rep-p').addEventListener('click',function(){form.rep=Math.min(60,form.rep+1);paintForm()});
  $('f-valor').addEventListener('keydown',function(e){if(e.key==='Enter')$('f-desc').focus()});
  $('f-desc').addEventListener('keydown',function(e){if(e.key==='Enter')onSave()});
  $('save').addEventListener('click',onSave);
  $('file-in').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    var rd=new FileReader();rd.onload=function(){importFrom(String(rd.result))};rd.onerror=function(){toast('Não consegui ler o arquivo.')};
    rd.readAsText(f);e.target.value='';
  });
  document.addEventListener('visibilitychange',function(){if(!document.hidden)renderAll()});
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredInstall=e;if(tab==='ajustes')renderView()});
  load();
  if(!memOnly&&navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){})}
  renderAll();
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')){
    window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
  }
}

/* ================= acesso por código (versão de teste) ================= */
function normCode(s){return String(s).toUpperCase().replace(/[^A-Z0-9]/g,'')}
async function hashCode(c){
  var buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(ACCESS_SALT+':'+normCode(c)));
  return Array.prototype.map.call(new Uint8Array(buf),function(b){return ('0'+b.toString(16)).slice(-2)}).join('');
}
function showGate(onOk){
  var g=$('gate');clear(g);g.hidden=false;
  var inp=el('input',{id:'g-code',type:'text',placeholder:'XXXXX-XXXXX',autocomplete:'off',autocapitalize:'characters',autocorrect:'off',spellcheck:'false','aria-label':'Código de acesso'});
  var err=el('div',{class:'g-err',role:'alert'});
  var btn=el('button',{class:'save',type:'button',text:'Entrar'});
  inp.addEventListener('input',function(){
    var v=normCode(inp.value).slice(0,10);
    inp.value=v.length>5?v.slice(0,5)+'-'+v.slice(5):v;err.textContent='';
  });
  async function go(){
    var code=normCode(inp.value);
    if(code.length<10){err.textContent='O código tem 10 letras e números.';return}
    btn.disabled=true;
    var h;
    try{h=await hashCode(code)}catch(e){err.textContent='Abra o app pelo endereço https do convite.';btn.disabled=false;return}
    if(ACCESS_HASHES.indexOf(h)>=0){
      try{window.localStorage.setItem(ACCESS_KEY,h)}catch(e){}
      g.hidden=true;clear(g);onOk();
    }else{
      await new Promise(function(r){setTimeout(r,700)});
      err.textContent='Código inválido. Confira e tente de novo.';btn.disabled=false;inp.focus();
    }
  }
  btn.addEventListener('click',go);
  inp.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
  g.append(el('div',{class:'box'},
    el('img',{src:'icon-192.png',alt:''}),
    el('h1',{text:'Meu dinheiro'}),
    el('p',{text:'Versão de teste. Digite o código que você recebeu no convite.'}),
    inp,err,btn,
    el('p',{class:'small',text:'Seus lançamentos ficam só neste aparelho. Ainda sem código? Peça a quem te convidou.'})));
  setTimeout(function(){inp.focus()},100);
}
function boot(){
  if(!ACCESS_HASHES.length){setup();return}
  var ok=false;
  try{var st=window.localStorage.getItem(ACCESS_KEY);ok=!!st&&ACCESS_HASHES.indexOf(st)>=0}catch(e){}
  if(ok){setup();return}
  showGate(setup);
}
boot();
})();
